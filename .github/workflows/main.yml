name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }} (Vulkan ${{ matrix.vulkan }})
    strategy:
      fail-fast: false
      matrix:
        vulkan: [ON, OFF]
        name: [windows-msvc, linux-gcc, linux-clang]
        include:
          - name: windows-msvc
            os: windows-latest
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use HTTPS for GitHub submodule URLs
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang \
            libglfw3-dev libglew-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxxf86vm-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNANOVG_USE_SDL3=OFF
          -DNANOVG_BUILD_VULKAN=${{ matrix.vulkan }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # No -G: CMake picks the newest Visual Studio on the runner, so image upgrades
        # (e.g. windows-latest moving from VS 2022 to VS 2026) don't break configure.
        run: cmake -S . -B build -A x64 -DNANOVG_USE_SDL3=OFF -DNANOVG_BUILD_VULKAN=${{ matrix.vulkan }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel
